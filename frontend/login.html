<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Página de Login">
        <title>MM PitWall | Acesso ao Sistema</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="img/trophy-cup.svg" type="image/svg+xml">
        <style>
            .login_wrapper {
              min-height: calc(100vh - 180px);
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 1.5rem 0;
            }
        
            .login_card {
              background-color: var(--bg-surface);
              border: 1px solid var(--border);
              border-radius: var(--radius);
              padding: 2.25rem;
              width: 100%;
              max-width: 440px;
              box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        
            /* Abas de Navegação (Entrar / Cadastrar) */
            .tabs_auth {
              display: flex;
              gap: 0.5rem;
              border-bottom: 1px solid var(--border);
              margin-bottom: 1.5rem;
            }
        
            .tab_btn {
              flex: 1;
              padding: 0.75rem;
              background: none;
              border: none;
              color: var(--text-muted);
              font-weight: 700;
              font-size: 0.95rem;
              cursor: pointer;
              border-bottom: 2px solid transparent;
              transition: all 0.2s;
            }
        
            .tab_btn.is_active {
              color: var(--accent);
              border-bottom-color: var(--accent);
            }
        
            .auth_form {
              display: flex;
              flex-direction: column;
              gap: 1.1rem;
            }
        
            .auth_form input {
              background-color: var(--bg-card);
              color: var(--text-main);
              border: 1px solid var(--border);
              padding: 0.8rem 1rem;
              border-radius: var(--radius);
              font-size: 0.95rem;
              width: 100%;
            }
        
            .auth_form input:focus {
              border-color: var(--accent);
              outline: none;
            }
        
            .btn_acao {
              background-color: var(--accent);
              color: #ffffff;
              border: none;
              padding: 0.85rem;
              border-radius: var(--radius);
              font-size: 1rem;
              font-weight: 700;
              cursor: pointer;
              transition: background-color 0.2s;
              margin-top: 0.5rem;
            }
        
            .btn_acao:hover {
              background-color: var(--accent-hover);
            }
        
            .alerta_feedback {
              margin-top: 1rem;
              padding: 0.75rem 1rem;
              border-radius: var(--radius);
              font-size: 0.88rem;
              text-align: center;
              display: none;
            }
        
            .alerta_erro {
              background-color: rgba(225, 6, 0, 0.12);
              border: 1px solid var(--accent);
              color: #ff6b6b;
              display: block;
            }
        
            .alerta_sucesso {
              background-color: rgba(63, 185, 80, 0.12);
              border: 1px solid var(--accent-green);
              color: #4ade80;
              display: block;
            }
        
            .credenciais_dica {
              margin-top: 1.5rem;
              padding-top: 1.25rem;
              border-top: 1px solid var(--border);
              font-size: 0.8rem;
              color: var(--text-muted);
            }
        
            .credenciais_dica strong {
              color: var(--accent-gold);
            }
        </style>
    </head>
    <body>
        <header>
            <div class="container header_content">
                <h1>MM PitWall</h1>
                <nav class="main_nav" aria-label="Navegação Login">
                    <ul>
                        <li><a href="index.html" class="nav_links">Voltar ao Início</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="container login_wrapper">
            <section class="login_card">
                <div class="tabs_auth" role="tablist">
                    <button type="button" class="tab_btn is_active" id="tab_login" role="tab" aria-selected="true">Entrar</button>
                    <button type="button" class="tab_btn" id="tab_cadastro" role="tab" aria-selected="false">Criar Conta</button>
                </div>
                
                <!-- LOGIN -->
                <form id="form_login" class="auth_form">
                    <div class="form_group">
                        <label for="login_email">E-mail ou nome de usuário:</label>
                        <input 
                            type="text" id="login_email" required
                        >
                    </div>

                    <div class="form_group">
                        <label for="login_senha">Senha:</label>
                        <input 
                            type="password" id="login_senha" required
                        >
                    </div>

                    <button type="submit" id="btn_login" class="btn_acao">Entrar no Sistema</button>
                </form>

                <!-- CADASTRO -->
                <form id="form_cadastro" class="auth_form" style="display: none;">
                    <div class="form_group">
                        <label for="cad_nome">Nome do usuário:</label>
                        <input 
                            type="text" id="cad_nome" required
                        >
                    </div>

                    <div class="form_group">
                        <label for="cad_email">Seu E-mail:</label>
                        <input 
                            type="email" id="cad_email" required
                        >
                    </div>

                    <div class="form_group">
                        <label for="cad_senha">Sua senha:</label>
                        <input 
                            type="password" id="cad_senha" required
                        >
                    </div>

                    <button type="submit" id="btn_cadastro" class="btn_acao">Cadastrar-se</button>
                </form>

                <div id="box_feedback" class="alerta_feedback" aria-live="polite"></div>

            </section>
        </main>
        <footer>
            <div class="footer_content">
                <p>&copy; 2026 MM PitWall. Trabalho acadêmico desenvolvido para a disciplina de Sistemas Computacionais (SCOM)</p>
                <p>Dados e mecânicas inspirados no simulador <em>Motorsport Manager</em> (Playsport Games). Projeto sem fins lucrativos.</p>
            </div>
        </footer>
        <script src="login.js"></script>
    </body>
</html>
